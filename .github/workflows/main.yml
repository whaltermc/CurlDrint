name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel older in-progress runs on the same branch/PR when new commits land
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repo doesn't ship a gradle-wrapper.jar (it's a binary file), so we let
      # this action install Gradle itself and drive the build with the plain
      # `gradle` command instead of `./gradlew`. It still caches dependencies and
      # build outputs between runs the same way the wrapper approach would.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blockforge-installer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint/test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
          
